  <style>

*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--light)}button{cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:default}button,input,select,textarea{min-height:44px}button{background:var(--raised);border:1px solid var(--border);border-radius:12px;padding:9px 15px;font-weight:700}button:hover{border-color:var(--light)}.primary{background:var(--blue);border-color:var(--blue);color:white}.success{background:#087451}.ghost{background:transparent}.skip{position:fixed;top:-100px;z-index:10}.skip:focus{top:0}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,56px);position:sticky;top:0;z-index:3;border-bottom:1px solid var(--border);background:#090d16ed;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:7px;font-size:22px;font-weight:900;letter-spacing:-.06em}.brand em{color:var(--light);font-style:normal}.logo{background:var(--blue);color:white;border-radius:11px;display:grid;place-items:center;width:37px;height:37px;margin-right:5px;font-size:24px}.nav{display:grid;gap:8px}.nav button{text-align:left;background:transparent;border-color:transparent;color:var(--muted);min-height:50px}.nav button[aria-current]{background:#172a51;color:#a8cbff;border-color:#274675}.nav span{display:inline-block;width:26px;text-align:center;margin-right:8px}
main{max-width:1120px;margin:0 auto;padding:30px clamp(16px,4vw,48px) 100px}.intro,.onboarding{max-width:650px;margin:auto}.intro{padding-top:clamp(18px,6vw,88px)}.intro .hero{padding:clamp(22px,6vw,52px)}.intro h1{font-size:clamp(35px,6vw,55px)}h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.3;letter-spacing:-.045em}h1{font-size:clamp(26px,5vw,40px)}h2{font-size:21px}h3{font-size:16px}p{color:var(--muted)}.muted,small{color:var(--muted)}.accent{color:var(--light)}.positive{color:var(--green)}.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:800;color:var(--light)}.stack{display:grid;gap:15px}.row,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.actions>*{flex:1;white-space:nowrap}.card,.hero{padding:20px;background:var(--card);border:1px solid var(--border);border-radius:16px;min-width:0}.hero{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 96% 0,#243e7d 0,transparent 65%),linear-gradient(125deg,#111d36,#11182a);padding:26px;border-color:#30466e}.hero:after{content:"";position:absolute;z-index:-1;right:-60px;top:-115px;width:315px;height:315px;border:1px solid #8ab4ff27;border-radius:50%;box-shadow:0 0 0 24px #8ab4ff13,0 0 0 55px #8ab4ff0c,0 0 0 90px #8ab4ff08;pointer-events:none}.pill{display:inline-flex;border:1px solid #35528a;background:#1a315b;color:#a9ccff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}.grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{font-size:27px;font-weight:850;font-variant-numeric:tabular-nums}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.week button{padding:9px 2px;background:var(--card);display:grid;justify-items:center;gap:3px;font-size:13px}.week button[aria-pressed=true]{background:#1c376c;border-color:#6197fd}.week small{font-size:10px}.section{margin-top:8px}.line{border-top:1px solid var(--border);padding-top:12px}.exercise{display:flex;gap:12px;align-items:center}.index{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:11px;background:#1c2e53;color:var(--light);font-weight:800}.track{height:8px;background:var(--raised);border-radius:30px;overflow:hidden}.track span{display:block;height:100%;border-radius:inherit;background:#5994ff;width:var(--percent);transition:width .3s}.track.green span{background:#10b981}.track.purple span{background:#a855f7}
label{display:grid;gap:6px;font-weight:650}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;background:#111a2d;color:var(--text);padding:9px 11px}textarea{resize:vertical}fieldset{min-width:0;margin:0;padding:12px;border:1px solid var(--border);border-radius:12px}legend{padding:0 6px;font-weight:700}.checks{display:flex;flex-wrap:wrap;gap:7px}.checks label,.check{display:flex;align-items:center;gap:7px;min-height:44px;padding:5px 9px;background:#111a2d;border:1px solid var(--border);border-radius:10px;font-size:13px}.checks label:has(:checked){border-color:#5b96ff;color:#a8cbff;background:#182d52}.checks input,.check input{width:17px;min-height:17px;accent-color:#397afb}.check:has(:checked){color:var(--green);border-color:#247658}.error{color:#ffabb6}.steps{display:flex;gap:7px}.steps span{height:4px;background:var(--raised);border-radius:8px;flex:1}.steps .active{background:#5994ff}.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:4px}.stepper button{padding:0}.stepper input{text-align:center;padding-inline:4px}.sticky{position:sticky;bottom:68px;padding:10px;background:#090d16ed;border-top:1px solid var(--border);z-index:2}.meal{width:100%;text-align:left}.meal .row{flex-wrap:nowrap}[hidden]{display:none!important}dialog{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:22px;width:min(540px,calc(100vw - 24px));max-height:90vh}dialog::backdrop{background:#03060cc9;backdrop-filter:blur(5px)}#toast{position:fixed;z-index:6;bottom:78px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);width:max-content;background:#203552;border-radius:12px;padding:10px 16px}#toast:empty{display:none}
@media(min-width:850px){body:has(#sidebar:not([hidden])) main{margin-left:max(210px,calc((100% - 1350px)/2 + 210px))}#sidebar{position:fixed;left:max(0px,calc((100% - 1350px)/2));top:72px;bottom:0;width:210px;padding:20px 14px;border-right:1px solid var(--border)}.sticky{bottom:0}}
@media(max-width:849px){#sidebar{position:fixed;bottom:0;left:0;right:0;z-index:4;background:#090d16f5;backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:4px 5px max(4px,env(safe-area-inset-bottom))}.nav{grid-template-columns:repeat(4,1fr);gap:3px}.nav button{text-align:center;padding:3px 0;font-size:11px}.nav span{display:block;margin:auto;font-size:16px}}
@media(max-width:480px){.grid.mobile-stack{grid-template-columns:1fr}.hero,.card{padding:16px}.metric{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.checks label:has(input[name=avoid]:checked){background:#391b2b;border-color:#a45772;color:#ffc0d0}
.sticky{display:grid;grid-template-columns:2fr 3fr;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.sticky button{white-space:normal}
@media(max-width:600px){
  #workoutForm .grid.three{grid-template-columns:1fr}
  main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
  .sticky{bottom:calc(59px + env(safe-area-inset-bottom))}
}

<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header><a class="brand" href="#home"><span class="logo" aria-hidden="true">✦</span>FitMate <em>AI</em></a><span id="profileBadge"></span></header>
  <aside id="sidebar" hidden></aside>
  <main id="main" tabindex="-1"></main>
  <dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
  <div id="toast" role="status"></div>
<script>
(() => {
'use strict';
const days = ['월','화','수','목','금','토','일'];
const goals = ['체지방 감량','근육 증가','체중 유지','체력 향상'];
const exercises = [
  ['벤치프레스','상체','헬스장'], ['랫풀다운','상체','헬스장'], ['덤벨 숄더프레스','상체','헬스장'],
  ['시티드 로우','상체','헬스장'], ['레그프레스','하체·코어','헬스장'], ['레그 컬','하체·코어','헬스장'],
  ['스쿼트','하체·코어','헬스장'], ['푸시업','상체','홈트레이닝'], ['밴드 로우','상체','홈트레이닝'],
  ['벽 푸시업','상체','홈트레이닝'], ['밴드 풀어파트','상체','홈트레이닝'], ['맨몸 스쿼트','하체·코어','홈트레이닝'],
  ['런지','하체·코어','홈트레이닝'], ['글루트 브리지','하체·코어','홈트레이닝'],
  ['데드 버그','하체·코어','공통'], ['버드독','하체·코어','공통'], ['밴드 컬','상체','공통']
];

// Approximate values per 100 g of prepared food: carbs, protein, fat, and KRW.
const foods = [
  ['현미밥','탄수화물',26,3,1,450], ['찐 고구마','탄수화물',26,2,0.2,650],
  ['오트밀','탄수화물',12,2.5,1.5,430,'귀리 글루텐'], ['잡곡밥','탄수화물',28,3,1,480],
  ['닭가슴살','단백질',0,31,3.6,1350,'닭 가금류'], ['두부','단백질',2,9,5,620,'대두 콩'],
  ['삶은 달걀','단백질',1,13,11,750,'계란 난류 달걀'], ['연어 구이','단백질',0,22,12,3800,'생선 어류 연어'],
  ['돼지 안심','단백질',0,26,4,1650,'돼지고기'], ['렌틸콩','단백질',20,9,0.4,520,'콩'],
  ['브로콜리','채소',7,2.8,0.4,900], ['당근','채소',10,1,0.2,420],
  ['양배추','채소',6,1.3,0.1,390], ['시금치','채소',4,3,0.4,880],
  ['올리브유','지방',0,0,100,1900], ['아보카도','지방',9,2,15,2100]
];

const schedules = {2:[0,3],3:[0,2,4],4:[0,1,3,5],5:[0,1,2,4,5],6:[0,1,2,3,4,5]};

function workoutPlan(profile, rotation = 0) {
  const training = schedules[profile.frequency];
  const available = exercises.filter(([name,,place]) =>
    (place === '공통' || place === profile.place) && !profile.avoid.includes(name));
  const groups = ['상체','하체·코어'];
  if (groups.some(group => !available.some(([,area]) => area === group))) {
    throw new Error('상체와 하체 운동을 각각 한 종목 이상 남겨 주세요.');
  }
  return days.map((_, day) => {
    const slot = training.indexOf(day);
    if (slot < 0) return {title:'회복 및 휴식', minutes:0, items:[]};
    const group = groups[(slot + rotation) % 2];
    const pool = available.filter(([,area]) => area === group);
    const ordered = pool.slice().sort(([a],[b]) => Number(profile.prefer.includes(b)) - Number(profile.prefer.includes(a)));
    const sets = profile.age < 18 || profile.level === '초보자' ? 2 : profile.level === '상급자' ? 4 : 3;
    const reps = profile.goal === goals[1] ? 10 : profile.goal === goals[3] ? 15 : 12;
    const rest = reps === 10 ? 90 : 60;
    const minutesPerExercise = Math.ceil((sets * (reps * 3 + 30) + (sets - 1) * rest) / 60);
    const count = Math.min(pool.length, 5, Math.floor((profile.duration - 8) / minutesPerExercise));
    return {
      title:group, minutes:8 + count * minutesPerExercise,
      items:ordered.slice(0,count).map(([name]) => ({name,sets,reps,rest}))
    };
  });
}

function nutritionGoal(profile, active) {
  if (profile.age < 18) return null;
  const offset = {남성:5,여성:-161}[profile.sex] ?? -78;
  const base = profile.bmr || 10 * profile.weight + 6.25 * profile.height - 5 * profile.age + offset;
  const change = profile.goal === goals[0] ? -150 : profile.goal === goals[1] ? 150 : 0;
  const kcal = Math.round(Math.max(1500, base * (active ? 1.45 : 1.32) + change) / 10) * 10;
  return {kcal,carb:Math.round(kcal * .5 / 4),protein:Math.round(kcal * .22 / 4),fat:Math.round(kcal * .28 / 9)};
}

function nutrition(food, grams) {
  const {carb, protein, fat, kcal} = food;
  const factor = grams / 100;
  return {carb:carb*factor,protein:protein*factor,fat:fat*factor,kcal:kcal*factor};
}

function sumNutrition(items) {
  return items.reduce((sum, item) => ({
    kcal:sum.kcal+item.kcal,carb:sum.carb+item.carb,protein:sum.protein+item.protein,fat:sum.fat+item.fat
  }), {kcal:0,carb:0,protein:0,fat:0});
}

function mealPlan(profile, workouts, preferences) {
  const exclusions = preferences.exclude.normalize('NFKC').toLowerCase().split(/[\s,;\/·，()]+/).filter(Boolean);
  const pool = foods.filter(([name,,,,,,aliases='']) =>
    !exclusions.some(term => name.toLowerCase().includes(term) || aliases.includes(term)));
  const kinds = ['탄수화물','단백질','채소','지방'];
  if (kinds.some(kind => !pool.some(([,category]) => category === kind))) {
    throw new Error('제외 조건을 적용하면 모든 식품군을 구성할 수 없습니다.');
  }
  const choose = (kind, index, economical) => {
    const options = pool.filter(([,category]) => category === kind);
    if (economical) return options.sort((a,b) => a[5] - b[5])[0];
    const preferred = options.filter(([name]) => preferences.prefer.includes(name));
    const candidates = preferred.length && index % 3 !== 2 ? preferred : options;
    return candidates[index % candidates.length];
  };
  const buildDay = (workout, day, economical) => {
    const target = nutritionGoal(profile, workout.items.length > 0);
    const labels = {2:['첫 식사','두 번째 식사'],3:['아침','점심','저녁'],4:['아침','점심','간식','저녁'],5:['아침','오전 간식','점심','오후 간식','저녁'],6:['아침','오전 간식','점심','오후 간식','저녁','저녁 간식']};
    const meals = labels[preferences.count].map((title, index) => {
      const portions = [160,110,100,12];
      const size = /간식/.test(title) ? .56 : 1;
      const standard = target ? target.kcal / 2100 : 1;
      const foods = kinds.map((kind,k) => {
        const [name,,carb,protein,fat,price] = choose(kind,day+index+k,economical);
        const grams = Math.round(portions[k] * standard * size * 3 / preferences.count);
        return {name,grams,carb,protein,fat,kcal:4*(carb+protein)+9*fat,price};
      });
      return {title,foods};
    });
    const all = meals.flatMap(meal => meal.foods);
    if (target) {
      const total = all.reduce((sum,food) => sum+food.kcal*food.grams/100,0);
      all.forEach(food => {food.grams = Math.max(1,Math.round(food.grams * target.kcal / total));});
    }
    const cost = Math.ceil(all.reduce((sum,food) => sum+food.grams*food.price/100,0));
    return {target,meals,cost};
  };
  return workouts.map((workout, day) => {
    const plan = buildDay(workout,day,false);
    if (plan.cost <= preferences.budget) return plan;
    const economical = buildDay(workout,day,true);
    if (economical.cost <= preferences.budget) return economical;
    throw new Error('예산 범위에 맞는 식단을 구성하지 못했습니다. 하루 식비를 조정해 주세요.');
  });
}

function dateKey(day, now = new Date()) {
  const date = new Date(now);
  date.setDate(date.getDate() - (date.getDay() + 6) % 7 + day);
  return [date.getFullYear(),date.getMonth()+1,date.getDate()].join('-');
}


const $ = id => document.getElementById(id);
const main = $('main');
const dialog = $('dialog');
const storageKey = 'fitmate-ai-v1';
const empty = {profile:null,workouts:null,diet:null,preferences:null,records:{}};
let state = empty;
try {
  state = {...empty,...JSON.parse(localStorage.getItem(storageKey))};
} catch {
  $('toast').textContent = '저장된 정보를 불러오지 못했습니다.';
}
const today = () => (new Date().getDay()+6)%7;
let day = today();
let page = state.profile ? 'routine' : 'home';
let draft = state.profile || {};
let mealIndex = 0;
let generation;
let timer;
let toastTimeout;

const esc = value => String(value ?? '').replace(/[&<>"']/g, char =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const format = (n, digits=0) => Number(n).toLocaleString('ko-KR',{maximumFractionDigits:digits});
const button = (label, action, cls='', value='') =>
  `<button type="button" class="${cls}" data-action="${action}" data-value="${esc(value)}">${label}</button>`;
const submit = (label, cls='primary', value='save') =>
  `<button class="${cls}" type="submit" value="${value}">${label}</button>`;
const num = (label,name,min,max,value='',step=1,required=true) =>
  `<label>${label}<input name="${name}" type="number" min="${min}" max="${max}" step="${step}" value="${esc(value)}" ${required?'required':''}></label>`;
const select = (label,name,options,value='') =>
  `<label>${label}<select name="${name}" required><option value="" disabled ${value===''?'selected':''}>선택해 주세요</option>${options.map(option =>
    `<option ${String(value)===String(option)?'selected':''}>${option}</option>`).join('')}</select></label>`;
const area = (label,name,max,value='',placeholder='') =>
  `<label>${label}<textarea name="${name}" maxlength="${max}" rows="2" placeholder="${esc(placeholder)}">${esc(value)}</textarea></label>`;
const checks = (label,name,options,selected=[]) =>
  `<fieldset><legend>${label}</legend><div class="checks">${options.map(option =>
    `<label><input type="checkbox" name="${name}" value="${option}" ${selected.includes(option)?'checked':''}>${option}</label>`).join('')}</div></fieldset>`;
const check = (label,name,value) =>
  `<label class="check"><input type="checkbox" name="${name}" ${value?'checked':''}>${label}</label>`;
const bar = (value, color='') =>
  `<div class="track ${color}" role="progressbar" aria-label="진행률" aria-valuenow="${value}" aria-valuemin="0" aria-valuemax="100"><span style="--percent:${value}%"></span></div>`;
const percent = (value,max) => max ? Math.min(100,Math.round(value/max*100)) : 0;
const section = (title,description,action='') =>
  `<div class="row between"><div class="stack" style="gap:5px"><h1>${title}</h1><p>${description}</p></div>${action}</div>`;
const record = () => state.records[dateKey(day)] || {};
const mealKey = (meal,index) => JSON.stringify([index,meal.foods.map(food=>food.name)]);
const mealRecord = (meal,index) => record().meals?.[mealKey(meal,index)];
const getMeals = () => state.diet?.[day]?.meals ?? [];
const dayWorkout = () => state.workouts[day];

function save(next, message) {
  localStorage.setItem(storageKey,JSON.stringify(next));
  state = next;
  if (message) notify(message);
}

function updateRecord(patch,message) {
  save({...state,records:{...state.records,[dateKey(day)]:{...record(),...patch}}},message);
}

function notify(message) {
  $('toast').textContent = message;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=> $('toast').textContent = '',3500);
}

function go(next) {
  if (timer) {clearInterval(timer);timer=null;}
  page=next;
  render();
  main.focus({preventScroll:true});
  window.scrollTo({top:0});
}

function week() {
  return `<div class="week" aria-label="요일 선택">${days.map((label,index)=>
    `<button data-action="day" data-value="${index}" aria-pressed="${index===day}"><strong>${label}</strong><small class="${state.workouts[index].items.length?'accent':''}">${index===today()?'오늘':state.workouts[index].items.length?'운동':'휴식'}</small></button>`).join('')}</div>`;
}

function stepper(label,name,min,max,value,step=1,increment=step) {
  return `<div><label for="${name}">${label}</label><div class="stepper">${button('−','step','ghost',-increment)}<input id="${name}" name="${name}" type="number" min="${min}" max="${max}" step="${step}" required value="${esc(value)}">${button('+','step','ghost',increment)}</div></div>`;

function mealTotals(meal,log) {
  return sumNutrition([...meal.foods.map((food,index)=>nutrition(food,log?.grams[index]??food.grams)),
    {kcal:log?.extraCalories??0,carb:0,protein:0,fat:0}]);
}

function totalActual() {
  return sumNutrition(Object.entries(record().meals ?? {}).flatMap(([key, log]) => {
    if (log.totals) return [log.totals];
    // Earlier records stored amounts and food names without a nutrient snapshot.
    const [, names] = JSON.parse(key);
    const items = names.map((name, index) => {
      const [, , carb, protein, fat] = foods.find(food => food[0] === name);
      return nutrition({carb, protein, fat, kcal: 4 * (carb + protein) + 9 * fat}, log.grams[index]);
    });
    return [sumNutrition([...items, {kcal:log.extraCalories ?? 0, carb:0, protein:0, fat:0}])];
  }));
}

function macros(actual,target) {
  return `<div class="grid three">${[['탄수화물','carb',''],['단백질','protein','green'],['지방','fat','purple']].map(([label,key,color])=>

}

function syncMeal() {
  const meal=getMeals()[mealIndex];

function generate(profile, rotation) {
  const plan=workoutPlan(profile,rotation);
  let diet=null;
  if (state.preferences) diet=mealPlan(profile,plan,state.preferences);
  openDialog('맞춤 운동 루틴을 만들고 있습니다.',`<p role="status" id="generation">사용자 정보 분석 중</p><div id="generationBar">${bar(25)}</div>${button('취소','close','ghost')}`);
  let stage=0;
  generation=setInterval(()=>{
    stage++;
    if (stage<3) {
      $('generation').textContent=['','운동 부위 배분 중','운동 계획 생성 중'][stage];
      $('generationBar').innerHTML=bar(25+stage*25);
      return;
    }
    clearInterval(generation);
    generation=null;
    try {
      save({...state,profile,workouts:plan,diet,rotation},'주간 운동 계획을 만들었습니다.');
      dialog.close();
      go('routine');
    } catch {
      $('generation').textContent='운동 계획을 저장하지 못했습니다. 닫은 후 다시 시도해 주세요.';
    }
  },250);
}

dialog.addEventListener('close',()=>{
  if (generation) {clearInterval(generation);generation=null;}
});

document.addEventListener('click',event=>{
  if (event.target.closest('.brand')) {
    event.preventDefault();
    go(state.profile?'routine':'home');
    return;
  }
  const target=event.target.closest('[data-action]');
  if (!target) return;
  const {action,value}=target.dataset;
  try {
    switch(action) {
      case 'day': day=Number(value);render();main.querySelector('.week [aria-pressed="true"]')?.focus();break;
      case 'today': day=today();render();break;
      case 'backBody': go(state.profile?'profile':'home');break;
      case 'backGoal': go('body');break;
      case 'editProfile': draft={...state.profile,demo:false};go('body');break;
      case 'editRoutine': draft={...state.profile};go('goal');break;
      case 'dietSettings': settings();break;
      case 'close': dialog.close();break;
      case 'meal': mealIndex=Number(value);go('meal');break;
      case 'step': {
        const input=target.parentElement.querySelector('input');
        const next=Math.min(Number(input.max),Math.max(Number(input.min),Number(input.value)+Number(value)));
        input.value=Number(next.toFixed(1));
        input.dispatchEvent(new Event('input',{bubbles:true}));
        break;
      }
      case 'timer': {
        if (timer) {clearInterval(timer);timer=null;target.textContent='다시 시작';break;}
        const started=Date.now();
        target.textContent='타이머 정지';
        $('timer').textContent='00:00';
        timer=setInterval(()=>{
          const seconds=Math.floor((Date.now()-started)/1000);
          $('timer').textContent=[Math.floor(seconds/60),seconds%60].map(n=>String(n).padStart(2,'0')).join(':');
        },200);
        break;
      }
      case 'demo': {
        const p={sex:'남성',age:24,height:183,weight:78,bmi:'23.3',fat:18,muscle:36,bmr:1800,goal:goals[0],level:'중급자',frequency:4,duration:60,place:'헬스장',prefer:[],avoid:[],demo:true};
        const preferences={count:4,budget:16000,prefer:[],exclude:'',request:''};
        const workouts=workoutPlan(p);
        save({...empty,profile:p,workouts,preferences,diet:mealPlan(p,workouts,preferences)});
        day=workouts[today()].items.length?today():workouts.findIndex(workout=>workout.items.length);
        go('routine');
        break;
      }
      default: go(action);
    }
  } catch(error) {
    notify(error.message);
  }
});

document.addEventListener('input',event=>{
  if (event.target.form?.id==='bodyForm') syncBody();
  if (event.target.form?.id==='mealForm') syncMeal();
  if (event.target.type==='checkbox' && ['prefer','avoid'].includes(event.target.name) && event.target.form?.id==='goalForm') {
    const selected=new FormData(event.target.form).getAll(event.target.name);
    if (selected.length>10) {event.target.checked=false;notify('같은 항목은 최대 10개까지 선택할 수 있습니다.');}
  }
});

document.addEventListener('submit',event=>{
  const form=event.target;
  event.preventDefault();
  const data=new FormData(form);
  const values=Object.fromEntries(data);
  const complete=event.submitter?.value==='complete';
  try {
    switch(form.id) {
      case 'bodyForm': {
        for(const key of ['age','height','weight','fat','muscle','bmr']) values[key]=values[key]===''?'':Number(values[key]);
        draft={...draft,...values,bmi:(values.weight/(values.height/100)**2).toFixed(1)};
        go('goal');
        break;
      }
      case 'goalForm': {
        const prefer=data.getAll('prefer');
        const avoid=data.getAll('avoid');
        if (prefer.some(name=>avoid.includes(name))) throw new Error('동일한 운동을 선호와 제외에 동시에 선택할 수 없습니다.');
        generate({...draft,...values,frequency:Number(values.frequency),duration:Number(values.duration),prefer,avoid},state.rotation??0);
        break;
      }
      case 'dietForm': {
        const preferences={...values,count:Number(values.count),budget:Number(values.budget),prefer:data.getAll('prefer')};
        const diet=mealPlan(state.profile,state.workouts,preferences);
        save({...state,preferences,diet},'주간 식단을 만들었습니다.');
        dialog.close();
        go('diet');
        break;
      }
      case 'workoutForm': {
        const exercises={...record().exercises};
        dayWorkout().items.forEach((item,i)=>{
          const sets=Number(values['sets'+i]);
          const reps=Number(values['reps'+i]);
          exercises[item.name]={done:(complete||data.has('done'+i))&&sets>0&&reps>0,sets,reps,weight:Number(values['weight'+i]),memo:values['memo'+i]};
        });
        updateRecord({exercises,workoutDone:dayWorkout().items.every(item=>exercises[item.name]?.done)},'운동 기록을 저장했습니다.');
        go('routine');
        break;
      }
      case 'mealForm': {
        if (Number(values.extraCalories)>0&&!values.extra.trim()) throw new Error('추가 음식 이름을 입력해 주세요.');
        const meal=getMeals()[mealIndex];
        const log={
          grams:meal.foods.map((_,i)=>Number(values['grams'+i])),done:complete||data.has('done'),extra:values.extra.trim(),extraCalories:Number(values.extraCalories)
        };
        const meals={...record().meals,[mealKey(meal,mealIndex)]:{...log,totals:mealTotals(meal,log)}};
        updateRecord({meals,mealsDone:getMeals().every((item,i)=>meals[mealKey(item,i)]?.done)},'식사 기록을 저장했습니다.');
        go('diet');
        break;
      }
      case 'dayForm':
        updateRecord({memo:values.memo,workoutDone:data.has('workoutDone'),mealsDone:data.has('mealsDone')},'하루 기록을 저장했습니다.');
        break;
    }
  } catch(error) {
    const message=form.querySelector('.error');
    if(message) message.textContent=error.message;
    else notify(error.message);
  }
});

render();
})();
</script>
</body>
</html>
